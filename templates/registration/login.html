{% extends "base.html" %}
{% block title %}Ingreso | SGR{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h2 class="h4 text-institucional fw-bold mb-3">Ingreso al SGR</h2>
                <form method="post">
                    {% csrf_token %}
                    {% if form.non_field_errors %}
                    <div class="alert alert-danger">{{ form.non_field_errors }}</div>
                    {% endif %}
                    <div class="mb-3">
                        <label class="form-label" for="{{ form.username.id_for_label }}">{{ form.username.label }}</label>
                        {{ form.username }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="{{ form.password.id_for_label }}">{{ form.password.label }}</label>
                        {{ form.password }}
                    </div>
                    <button type="submit" class="btn btn-custom-red w-100">Ingresar</button>
                </form>
                <p class="text-center small mt-3 mb-0">
                    <a href="{% url 'recuperacion_solicitar' %}">Olvidé mi contraseña</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
