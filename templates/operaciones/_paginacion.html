{% if is_paginated %}
<nav class="mt-3" aria-label="Paginación">
    <ul class="pagination">
        {% if page_obj.has_previous %}<li class="page-item"><a class="page-link" href="?q={{ q|urlencode }}&estado={{ estado|urlencode }}&page={{ page_obj.previous_page_number }}">Anterior</a></li>{% endif %}
        <li class="page-item disabled"><span class="page-link">{{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span></li>
        {% if page_obj.has_next %}<li class="page-item"><a class="page-link" href="?q={{ q|urlencode }}&estado={{ estado|urlencode }}&page={{ page_obj.next_page_number }}">Siguiente</a></li>{% endif %}
    </ul>
</nav>
{% endif %}
