{% extends "base.html" %}
{% block title %}Usuario | SGR{% endblock %}
{% block content %}
<h2 class="h4 fw-bold mb-4">{% if object %}Editar usuario{% else %}Registrar usuario municipal{% endif %}</h2>
<form method="post" class="card shadow-sm">
    {% csrf_token %}
    <div class="card-body">
        {% include "includes/form_campos.html" %}
        <button type="submit" class="btn btn-custom-red">Guardar</button>
        <a href="{% url 'usuarios:lista' %}" class="btn btn-outline-secondary">Cancelar</a>
    </div>
</form>
{% endblock %}
{% block extra_js %}
<script>
  const rolUsuario = document.getElementById('id_rol');
  const cargoUsuario = document.getElementById('id_cargo');
  const rolesFuncionario = [{% for rol in form.fields.rol.queryset %}{% if rol.codigo == 'funcionario' %}'{{ rol.pk }}',{% endif %}{% endfor %}];
  if (rolUsuario && cargoUsuario) {
    const grupoCargo = cargoUsuario.closest('.mb-3');
    function mostrarCargo() {
      const disponible = rolesFuncionario.includes(rolUsuario.value);
      grupoCargo.hidden = !disponible;
      if (!disponible) cargoUsuario.value = '';
    }
    rolUsuario.addEventListener('change', mostrarCargo);
    mostrarCargo();
  }
</script>
{% endblock %}
