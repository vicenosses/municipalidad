<form method="post" action="{% url 'sgr:periodo_estado' periodo.pk %}" class="d-inline">
    {% csrf_token %}
    <input type="hidden" name="activo" value="{% if periodo.activo %}false{% else %}true{% endif %}">
    <button type="submit" class="btn btn-sm btn-outline-warning">{% if periodo.activo %}Desactivar{% else %}Activar{% endif %}</button>
</form>
