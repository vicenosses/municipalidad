<div class="mb-3">
    {% if field.field.widget.input_type == 'checkbox' %}
    <div class="form-check">{{ field }} <label class="form-check-label" for="{{ field.id_for_label }}">{{ field.label }}</label></div>
    {% else %}
    <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span aria-hidden="true">*</span>{% endif %}</label>
    {{ field }}
    {% endif %}
    {% if field.help_text %}<div class="form-text" id="{{ field.id_for_label }}_helptext">{{ field.help_text }}</div>{% endif %}
    {% if field.errors %}<div class="text-danger small">{{ field.errors }}</div>{% endif %}
</div>
